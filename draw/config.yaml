# keymap-drawer config, used by draw/draw.sh (`nix run .#draw`).
# Docs: https://github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md
draw_config:
  key_w: 64
  key_h: 60
  split_gap: 30
  combo_w: 30
  combo_h: 24
  inner_pad_w: 2
  inner_pad_h: 2
  outer_pad_w: 16
  outer_pad_h: 44
  small_pad: 3
  key_rx: 7
  key_ry: 7
  legend_rel_y: 1
  shrink_wide_legends: 7
  append_colon_to_layer_header: false
  dark_mode: false # the media query in svg_style handles dark mode
  footer_text: ""
  glyph_tap_size: 16
  glyph_hold_size: 12
  glyph_shifted_size: 11

  # Colors are tokens on svg.keymap, so dark mode and the viewer page
  # (draw/site.py) can restyle them. Each layer has a color, used by the keys
  # that activate it, the key held on it and its overview corner.
  svg_style: |
    svg.keymap {
      --bg: #e6e9ef;
      --key: #fbfbfd;
      --key-edge: #ccd0da;
      --text: #4c4f69;
      --sub: #7c7f93;
      --ghost: #dce0e8;
      --dendron: #8c8fa1;
      --nav: #1e66f5;   --nav-soft: #d3e0fd;
      --fn: #8839ef;    --fn-soft: #e6d7fc;
      --num: #e64553;   --num-soft: #f9d6d9;
      --sys: #40a02b;   --sys-soft: #d5ebd0;
      --game: #df8e1d;  --game-soft: #f7e3c4;
      --mouse: #179299; --mouse-soft: #c9e7e8;
      --misc: #7287fd;  --misc-soft: #dce1fe;

      fill: var(--text);
      background-color: var(--bg);
      font-family: Inter, "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      font-kerning: normal;
      text-rendering: optimizeLegibility;
    }

    @media (prefers-color-scheme: dark) {
      svg.keymap {
        --bg: #11111b;
        --key: #1e1e2e;
        --key-edge: #313244;
        --text: #cdd6f4;
        --sub: #9399b2;
        --ghost: #181825;
        --dendron: #6c7086;
        --nav: #89b4fa;   --nav-soft: #2a3550;
        --fn: #cba6f7;    --fn-soft: #3a2f4f;
        --num: #f38ba8;   --num-soft: #4a2a36;
        --sys: #a6e3a1;   --sys-soft: #2c4030;
        --game: #fab387;  --game-soft: #4a3628;
        --mouse: #94e2d5; --mouse-soft: #24403d;
        --misc: #b4befe;  --misc-soft: #33364f;
      }
    }

    text { text-anchor: middle; dominant-baseline: middle; }
    text.tap { font-weight: 600; }
    text.hold, text.shifted { font-size: 9.5px; fill: var(--sub); font-weight: 500; }
    text.hold { dominant-baseline: auto; }
    text.shifted { dominant-baseline: hanging; }
    text.tl, text.tr, text.bl, text.br { font-size: 9.5px; font-weight: 700; }
    text.tl, text.bl { text-anchor: start; }
    text.tr, text.br { text-anchor: end; }
    text.tl, text.tr { dominant-baseline: hanging; }
    text.bl, text.br { dominant-baseline: auto; }
    text.combo { font-size: 9.5px; font-weight: 600; }
    text.combo.hold, text.combo.shifted { font-size: 7px; }
    text.layer-activator { text-decoration: none; }

    text.label {
      font-size: 17px;
      font-weight: 700;
      text-anchor: start;
      letter-spacing: 0.02em;
      fill: var(--text);
    }

    rect.key { fill: var(--key); stroke: var(--key-edge); stroke-width: 1; }
    rect.combo, rect.combo-separate { fill: var(--key); stroke: var(--dendron); stroke-width: 1; }
    rect.trans { fill: var(--ghost); stroke: none; }
    .layer-Combos rect.key { fill: var(--ghost); }
    /* keys combos are made of: a plain key with its base letter top left */
    .layer-Combos rect.combo-key { fill: var(--key); }
    .layer-Combos text.tl { fill: var(--sub); font-size: 11px; font-weight: 600; }
    .layer-Combos rect.combo { fill: var(--misc-soft); stroke: var(--misc); }
    path.combo { stroke: var(--dendron); stroke-width: 1.5; stroke-dasharray: 2 3; fill: none; }

    /* the key held to reach a layer, tinted in that layer's color */
    rect.held { fill: var(--misc-soft); stroke: var(--misc); stroke-width: 1.5; }
    .on-nav rect.held { fill: var(--nav-soft); stroke: var(--nav); }
    .on-fn rect.held { fill: var(--fn-soft); stroke: var(--fn); }
    .on-num rect.held { fill: var(--num-soft); stroke: var(--num); }
    .on-sys rect.held { fill: var(--sys-soft); stroke: var(--sys); }
    .on-mouse rect.held { fill: var(--mouse-soft); stroke: var(--mouse); }
    .on-game-fn rect.held { fill: var(--game-soft); stroke: var(--game); }

    /* game pages (draw/game.py): keys colored by what the bind does */
    rect.grp-ability { fill: var(--nav-soft); stroke: var(--nav); }
    rect.grp-item { fill: var(--game-soft); stroke: var(--game); }
    rect.grp-unit { fill: var(--sys-soft); stroke: var(--sys); }
    rect.grp-camera { fill: var(--mouse-soft); stroke: var(--mouse); }
    rect.grp-shop { fill: var(--fn-soft); stroke: var(--fn); }
    rect.grp-chat { fill: var(--num-soft); stroke: var(--num); }
    rect.grp-system, rect.grp-other { fill: var(--misc-soft); stroke: var(--misc); }
    rect.mod { fill: var(--ghost); stroke: var(--dendron); stroke-dasharray: 3 2; }
    rect.unbound { fill: var(--ghost); stroke: none; }
    g.unbound text { fill: var(--sub); }

    /* keys that switch layers: legend in the target layer's color. process.py
       tags them act-t-LAYER (tap switches) or act-h-LAYER (hold switches). */
    g[class*="act-t-"] text.tap, g[class*="act-h-"] text.hold { fill: var(--misc); font-weight: 700; }
    .act-t-nav text.tap, .act-h-nav text.hold { fill: var(--nav); }
    .act-t-fn text.tap, .act-h-fn text.hold { fill: var(--fn); }
    .act-t-num text.tap, .act-h-num text.hold { fill: var(--num); }
    .act-t-sys text.tap, .act-h-sys text.hold { fill: var(--sys); }
    .act-t-mouse text.tap, .act-h-mouse text.hold { fill: var(--mouse); }
    .act-t-game text.tap, .act-h-game text.hold,
    .act-t-game-fn text.tap, .act-h-game-fn text.hold { fill: var(--game); }

    /* overview corners: fn top-left, nav top-right, num bottom-left, sys bottom-right */
    text.tl, use.tl { fill: var(--fn); }
    text.tr, use.tr { fill: var(--nav); }
    text.bl, use.bl { fill: var(--num); }
    text.br, use.br { fill: var(--sys); }

    svg path { fill: inherit; }
    use.hold, use.shifted { fill: var(--sub); }

parse_config:
  # draw.sh adds zmk_additional_includes (zmk-helpers) and the physical layout

  raw_binding_map:
    "&sys_reset": Reset
    "&bootloader": Boot
    "&studio_unlock": Studio
    "&bt BT_SEL 0": BT 1
    "&bt BT_SEL 1": BT 2
    "&bt BT_SEL 2": BT 3
    "&bt BT_SEL 3": BT 4
    "&bt BT_SEL 4": BT 5
    "&bt BT_CLR": BT Clear
    "&cpf": CPF
    "&phone": Phone
    "&mail": Email
    "&caps_word": Caps Word
    "&swapper": { t: Alt-Tab, s: swapper }
    "&tog GAME": { t: Game, s: toggle }
    "&tog DOTA_SEL": { t: Dota, s: mode }
    "&to 0": { t: Base, s: to }

    "&kp LC(INS)": Copy
    "&kp LC(X)": Cut
    "&kp LC(V)": Paste
    "&kp LS(INS)": Paste
    "&kp LC(A)": tmux

    "&dot_spc": Sentence
    "&spc_morph": Space
    "&num_dance": { t: Smart Num }
    "&smart_mouse": Mouse
    "&key_repeat": Repeat
    "&leader": Leader
    "&comma_morph": { t: ",", s: ";" }
    "&dot_morph": { t: ".", s: ":" }
    "&qexcl": { t: "?", s: "!" }

    "&shift_repeat": Magic
    "&win_sleep": Sleep
    "&mmv MOVE_UP": Mouse ↑
    "&mmv MOVE_DOWN": Mouse ↓
    "&mmv MOVE_LEFT": Mouse ←
    "&mmv MOVE_RIGHT": Mouse →
    "&msc SCRL_UP": Scroll ↑
    "&msc SCRL_DOWN": Scroll ↓
    "&msc SCRL_LEFT": Scroll ←
    "&msc SCRL_RIGHT": Scroll →

    "&mkp LCLK": Left Click
    "&mkp RCLK": Right Click
    "&mkp MCLK": Middle Click

  trans_legend: { t: "", type: trans }

  # Combos that share a center point with another one, moved off it.
  zmk_combos:
    combo_mouse: { align: top }
    combo_ldr: { align: top }
    combo_cut: { align: bottom }

  zmk_keycode_map:
    LALT: Alt
    RALT: AltGr
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift
    SPACE: Space
    RET: Enter
    TAB: Tab
    ESC: Esc
    BSPC: Bksp
    DEL: Del
    PSCRN: PrtSc
    PG_UP: PgUp
    PG_DN: PgDn
    C_MUTE: $$mdi:volume-off$$
    C_PP: $$mdi:play-pause$$
    C_VOL_DN: $$mdi:volume-minus$$
    C_VOL_UP: $$mdi:volume-plus$$
    C_PREV: $$mdi:skip-previous$$
    C_NEXT: $$mdi:skip-next$$
    GRAVE: "`"
    MINUS: "-"
    EQUAL: "="
    SEMICOLON: ";"
    SQT: "'"
    COMMA: ","
    DOT: "."
    FSLH: "/"
    HOME: Home
    END: End
    INS: Ins
    K_CANCEL: Cancel
    RETURN: Enter
    AT: "@"
    HASH: "#"
    DLLR: "$"
    PRCNT: "%"
    CARET: "^"
    PLUS: "+"
    STAR: "*"
    AMPS: "&"
    UNDER: "_"
    PIPE: "|"
    BSLH: "\\"
    TILDE: "~"
    LT: "<"
    GT: ">"
    LPAR: "("
    RPAR: ")"
    LBRC: "{"
    RBRC: "}"
    LBKT: "["
    RBKT: "]"
    LEFT: ←
    RIGHT: →
    UP: ↑
    DOWN: ↓
