name: Draw keymap
# Redraws img/*.svg (keymap-drawer, see draw/draw.sh) whenever the keymap, a
# game's binds (games/) or the draw setup changes, commits them, and publishes
# the interactive viewer (site/) to GitHub Pages.
#
# Pages must be set to deploy from GitHub Actions once:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/**
      - games/**
      - draw/config.yaml
      - draw/*.sh
      - draw/*.py
      - flake.nix
      - flake.lock
      - .github/workflows/draw.yml

concurrency:
  group: draw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      # Same as running `nix run .#draw` locally.
      - run: nix run .#draw

      - name: Commit the drawings if they changed
        run: |
          git add img/*.svg draw/keymap.yaml
          if git diff --cached --quiet; then
            echo "keymap drawing is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(draw): redraw keymap"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: draw
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
