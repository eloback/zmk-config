name: Build ZMK firmware (nix)
on:
  workflow_dispatch:
  push:
    paths:
      - config/**
      - build.yaml
  pull_request:
    paths:
      - config/**
      - build.yaml

permissions:
  contents: read

jobs:
  build:
    uses: urob/zmk-actions/.github/workflows/build-user-config.yml@v9
    with:
      # 'gnuarmemb' (fastest), 'zephyr' or 'zephyr-full' (most compatible).
      # ZMK Studio requires 'zephyr-full'.
      toolchain: zephyr-full
