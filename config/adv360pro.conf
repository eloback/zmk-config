# Set sleep timeout to 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000


# Bluetooth tweaks
# Was on in the Kinesis fork (ZMK_BLE_EXPERIMENTAL_FEATURES in its board
# defconfig), but upstream leaves it off. Disables the 2M PHY for a more
# robust split link. Suspected fix for keys sticking and auto-repeating.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# CONFIG_BT_MAX_CONN=3
# CONFIG_BT_MAX_PAIRED=3


# Mouse keys (smart-mouse layer), upstream ZMK pointing
CONFIG_ZMK_POINTING=y

# ZMK Studio: no unlock key needed. Studio otherwise re-locks after 10 min
# idle and on every disconnect.
CONFIG_ZMK_STUDIO_LOCKING=n
